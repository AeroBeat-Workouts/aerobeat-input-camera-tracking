schema: aerobeat/gesture_detection_config
version: 1
profile: boxing
straight_punch:
  # Turn straight-punch detection on or off. input.
  enabled: true
  evaluation:
    # Only let brand-new hand samples count toward a punch. input.
    fresh_samples_only: true
    # Keep this many recent samples in the punch check history. input.
    sample_window_size: 4
    # Require this many positive bbox-growth steps inside the sample history. input.
    min_positive_growth_samples: 1
    # Measure wrist velocity across this much recent time. input.
    wrist_velocity_window_ms: 250
    # Measure bbox growth across this much recent time. input.
    bbox_area_growth_window_ms: 250
  thresholds:
    # Shared elbow+wrist punch speed must reach at least this value to count as a punch. input.
    min_punch_velocity: 0.5
    # Hand bbox growth must reach at least this value to count as a punch. input.
    min_bbox_area_growth: 0.003
  timing:
    # Keep the punch in its triggered state for this long after it fires. input.
    triggered_grace_ms: 500
  rearm:
    # After a punch, bbox area must shrink by at least this much before rearming when hands are enabled. input.
    bbox_area_retract_epsilon: 0.0003
    # When hand tracking is disabled, wait this long before rearming from the pose-only fallback. input.
    pose_only_rearm_ms: 250
  state_machine:
    # After tracking comes back, wait this long before punches can arm again. input.
    lost_tracking_reacquire_stable_ms: 40

hook:
  # Turn hook detection on or off. input.
  enabled: true
  evaluation:
    # Measure shared elbow+wrist averaged velocity across this much recent time. input.
    wrist_velocity_window_ms: 120
  thresholds:
    # Shared elbow+wrist averaged velocity must reach at least this value to count as a hook. input.
    min_velocity: 0.08
    # Hook motion must stay at least this much more lateral than vertical. input.
    min_lateral_dominance_ratio: 0.5
    # Required left/right horizontal travel must make up at least this much of total horizontal motion. input.
    min_horizontal_direction_ratio: 0.55
  timing:
    # Keep the hook in its triggered state for this long after it fires. input.
    triggered_grace_ms: 240
  rearm:
    # After a hook, wait this long before the pose-primary detector can rearm. input.
    pose_only_rearm_ms: 250
  state_machine:
    # After pose tracking comes back, wait this long before hooks can arm again. input.
    lost_tracking_reacquire_stable_ms: 40
uppercut:
  # Turn uppercut detection on or off. input.
  enabled: true
  evaluation:
    # Measure shared elbow+wrist averaged velocity across this much recent time. input.
    wrist_velocity_window_ms: 120
  thresholds:
    # Shared elbow+wrist averaged velocity must reach at least this value to count as an uppercut. input.
    min_velocity: 0.08
    # Uppercut motion must stay at least this much more vertical than lateral. input.
    min_vertical_dominance_ratio: 0.4
    # Upward travel must make up at least this much of total vertical motion. input.
    min_upward_direction_ratio: 0.55
  timing:
    # Keep the uppercut in its triggered state for this long after it fires. input.
    triggered_grace_ms: 240
  rearm:
    # After an uppercut, wait this long before the pose-primary detector can rearm. input.
    pose_only_rearm_ms: 250
  state_machine:
    # After pose tracking comes back, wait this long before uppercuts can arm again. input.
    lost_tracking_reacquire_stable_ms: 40
