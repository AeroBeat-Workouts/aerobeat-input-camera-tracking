schema: aerobeat/gesture_detection_config
version: 1
profile: boxing
guard:
  backend: threshold
  threshold:
    thresholds:
      max_wrist_separation_x: 0.20
      max_wrist_separation_y: 0.12
      max_wrist_nose_distance: 0.20

squat:
  backend: threshold
  threshold:
    thresholds:
      enter_height_ratio_max: 0.82
      exit_height_ratio_min: 0.92

weave:
  backend: threshold
  threshold:
    thresholds:
      enter_head_lateral_offset_min: 0.30
      enter_relative_head_hip_offset_min: 0.12
      enter_head_drop_ratio_min: 0.05
      exit_head_lateral_offset_max: 0.12
      exit_relative_head_hip_offset_max: 0.08

straight_punch:
  backend: threshold
  threshold:
    evaluation:
      fresh_samples_only: true
      sample_window_size: 4
      min_positive_growth_samples: 1
      window_ms: 250
    thresholds:
      min_velocity: 0.5
      min_bbox_area_growth: 0.003
      max_elbow_shoulder_xy_distance: 0.140
      min_wrist_lateral_angle_from_elbow_vertical_deg: 15.0
    depth:
      enabled: true
      model:
        artifact_path: res://addons/aerobeat-input-camera-tracking/assets/depth_models/midas/openvino_midas_v21_small_256/
      evaluation:
        model_input_size: 256
        sample_every_n_frames: 1
        max_sample_age_ms: 250
        sampling_mode: single_point
        region_geometry:
          wrist_shape: extended_capsule
          wrist_radius_px: 12
          wrist_extension_toward_elbow_px: 8
          torso_shape: center_box
          torso_half_width_px: 18
          torso_half_height_px: 18
          torso_anchor: shoulder_landmark
        aggregation:
          wrist_depth_stat: median
          torso_depth_stat: median
          trim_fraction: 0.0
          min_valid_samples: 1
        smoothing_window_samples: 3
        early_window_fraction: 0.35
        late_window_fraction: 0.35
      thresholds:
        min_closeness_delta: 0.06
        min_peak_closeness: 0.04
      debug:
        show_depth_signal: true
        show_depth_window_analysis: true
    timing:
      triggered_grace_ms: 10
    rearm:
      bbox_area_retract_epsilon: 0.0003
      pose_only_rearm_ms: 10
    state_machine:
      lost_tracking_reacquire_stable_ms: 40

hook:
  backend: threshold
  threshold:
    evaluation:
      window_ms: 250
    thresholds:
      min_velocity: 0.4
      max_wrist_angle_from_elbow_horizontal_deg: 25.0
    depth:
      enabled: true
      model:
        artifact_path: res://addons/aerobeat-input-camera-tracking/assets/depth_models/midas/openvino_midas_v21_small_256/
      evaluation:
        model_input_size: 256
        sample_every_n_frames: 1
        max_sample_age_ms: 250
        sampling_mode: single_point
        region_geometry:
          wrist_shape: extended_capsule
          wrist_radius_px: 12
          wrist_extension_toward_elbow_px: 8
          torso_shape: center_box
          torso_half_width_px: 18
          torso_half_height_px: 18
          torso_anchor: shoulder_landmark
        aggregation:
          wrist_depth_stat: median
          torso_depth_stat: median
          trim_fraction: 0.0
          min_valid_samples: 1
        smoothing_window_samples: 3
        early_window_fraction: 0.35
        late_window_fraction: 0.35
      thresholds:
        max_closeness_delta: 0.03
        max_peak_closeness: 0.06
      debug:
        show_depth_signal: true
        show_depth_window_analysis: true
    timing:
      triggered_grace_ms: 500
    rearm:
      pose_only_rearm_ms: 50
    state_machine:
      lost_tracking_reacquire_stable_ms: 40

uppercut:
  backend: threshold
  threshold:
    evaluation:
      window_ms: 250
    thresholds:
      min_velocity: 0.5
      max_wrist_angle_from_elbow_vertical_deg: 25.0
    depth:
      enabled: true
      model:
        artifact_path: res://addons/aerobeat-input-camera-tracking/assets/depth_models/midas/openvino_midas_v21_small_256/
      evaluation:
        model_input_size: 256
        sample_every_n_frames: 1
        max_sample_age_ms: 250
        sampling_mode: single_point
        region_geometry:
          wrist_shape: extended_capsule
          wrist_radius_px: 12
          wrist_extension_toward_elbow_px: 8
          torso_shape: center_box
          torso_half_width_px: 18
          torso_half_height_px: 18
          torso_anchor: shoulder_landmark
        aggregation:
          wrist_depth_stat: median
          torso_depth_stat: median
          trim_fraction: 0.0
          min_valid_samples: 1
        smoothing_window_samples: 3
        early_window_fraction: 0.35
        late_window_fraction: 0.35
      thresholds:
        max_closeness_delta: 0.03
        max_peak_closeness: 0.06
      debug:
        show_depth_signal: true
        show_depth_window_analysis: true
    timing:
      triggered_grace_ms: 500
    rearm:
      pose_only_rearm_ms: 50
    state_machine:
      lost_tracking_reacquire_stable_ms: 40
