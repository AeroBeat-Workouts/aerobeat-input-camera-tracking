schema: aerobeat/gesture_detection_config
version: 1
profile: boxing
guard:
  backend: threshold
  threshold:
    thresholds:
      max_wrist_separation_x: 0.20
      max_wrist_separation_y: 0.12
      max_wrist_nose_distance: 0.20

squat:
  backend: grid_avoidance
  grid_avoidance:
    obstacle:
      label: top_row
      occupied_rows: [0]
      occupied_cells: [0, 1, 2, 3]

weave:
  backend: grid_avoidance
  grid_avoidance:
    left_obstacle:
      label: left_columns
      occupied_columns: [0, 1]
      occupied_cells: [0, 1, 4, 5, 8, 9]
    right_obstacle:
      label: right_columns
      occupied_columns: [2, 3]
      occupied_cells: [2, 3, 6, 7, 10, 11]

straight_punch:
  backend: threshold
  threshold:
    evaluation:
      fresh_samples_only: true
      sample_window_size: 4
      min_positive_growth_samples: 1
      window_ms: 250
    thresholds:
      min_velocity: 0.5
      min_bbox_area_growth: 0.003
      max_elbow_shoulder_xy_distance: 0.140
      min_wrist_lateral_angle_from_elbow_vertical_deg: 15.0
    timing:
      triggered_grace_ms: 10
    rearm:
      bbox_area_retract_epsilon: 0.0003
      pose_only_rearm_ms: 10
    state_machine:
      lost_tracking_reacquire_stable_ms: 40

hook:
  backend: threshold
  threshold:
    evaluation:
      window_ms: 250
    thresholds:
      min_velocity: 0.4
      max_wrist_angle_from_elbow_horizontal_deg: 25.0
    timing:
      triggered_grace_ms: 500
    rearm:
      pose_only_rearm_ms: 50
    state_machine:
      lost_tracking_reacquire_stable_ms: 40

uppercut:
  backend: threshold
  threshold:
    evaluation:
      window_ms: 250
    thresholds:
      min_velocity: 0.5
      max_wrist_angle_from_elbow_vertical_deg: 25.0
    timing:
      triggered_grace_ms: 500
    rearm:
      pose_only_rearm_ms: 50
    state_machine:
      lost_tracking_reacquire_stable_ms: 40
