schema: aerobeat/gesture_detection_config
version: 1
profile: boxing
guard:
  # [disabled, threshold, prototype, classifier] Pick which backend contract owns guard routing. Only `threshold` has a real runtime implementation today; `prototype` and `classifier` stay as honest placeholders for the approved family-first config shape. input.
  backend: threshold
  threshold:
    # Guard uses the current pose-only runtime. input.
    thresholds:
      # Left/right wrists must be at least this close together in camera-space X. input.
      max_wrist_separation_x: 0.20
      # Left/right wrists must be at least this close together in camera-space Y. input.
      max_wrist_separation_y: 0.12
      # Each wrist must stay at least this close to the nose landmark in camera space. input.
      max_wrist_nose_distance: 0.20
  prototype: {}
  classifier: {}

squat:
  # [disabled, threshold, prototype, classifier] Pick which backend contract owns squat routing. Only `threshold` has a real runtime implementation today; `prototype` and `classifier` stay as honest placeholders for the approved family-first config shape. input.
  backend: disabled
  threshold:
    # Squat uses the current calibrated torso-height threshold runtime. input.
    thresholds:
      # Squat enters when live torso height / calibrated torso height drops to or below this ratio. input.
      enter_height_ratio_max: 0.82
      # Squat exits when live torso height / calibrated torso height rises back to or above this ratio. input.
      exit_height_ratio_min: 0.92
  prototype: {}
  classifier: {}

weave:
  # [disabled, threshold, prototype, classifier] Pick which backend contract owns weave routing. Only `threshold` has a real runtime implementation today; `prototype` and `classifier` stay as honest placeholders for the approved family-first config shape. input.
  backend: disabled
  threshold:
    # Weave uses the current pose-only runtime. input.
    thresholds:
      # Weave starts when head lateral offset reaches at least this far left or right. input.
      enter_head_lateral_offset_min: 0.30
      # Weave starts when head-vs-hip lateral offset reaches at least this far left or right. input.
      enter_relative_head_hip_offset_min: 0.12
      # Weave starts when head drop reaches at least this much below the standing baseline. input.
      enter_head_drop_ratio_min: 0.05
      # Weave ends when head lateral offset settles back within this neutral window. input.
      exit_head_lateral_offset_max: 0.12
      # Weave ends when head-vs-hip lateral offset settles back within this neutral window. input.
      exit_relative_head_hip_offset_max: 0.08
  prototype: {}
  classifier: {}

straight_punch:
  # [disabled, threshold, prototype, classifier] Pick which backend owns straight-punch routing. `classifier` now reads its straight-family artifact path from `straight_punch.classifier.model.artifact_path`; hooks and uppercuts choose their own backends independently. input.
  backend: threshold
  threshold:
    # Straight punches use the current threshold + hand-growth runtime when `backend: threshold`. input.
    evaluation:
      # Only let brand-new hand samples count toward a punch. input.
      fresh_samples_only: true
      # Keep this many recent samples in the punch check history. input.
      sample_window_size: 4
      # Require this many positive forward-punch bbox-growth steps inside the sample history. input.
      min_positive_growth_samples: 1
      # Measure the shared straight-punch motion window across this much recent time. input.
      window_ms: 250
    thresholds:
      # Shared elbow+wrist averaged velocity across the motion window must reach at least this value to count as a punch. input.
      min_velocity: 0.5
      # Windowed forward-punch bbox growth must reach at least this value to count as a punch. input.
      min_bbox_area_growth: 0.003
      # Elbow and shoulder must stay at least this close together in camera-space XY for the straight-arm pose hint. input.
      max_elbow_shoulder_xy_distance: 0.140
      # Wrist motion must deflect at least this far left/right away from the elbow-anchored vertical ray in camera-space XY. input.
      min_wrist_lateral_angle_from_elbow_vertical_deg: 15.0
    timing:
      # Keep the punch in its triggered state for this long after it fires. input.
      triggered_grace_ms: 10
    rearm:
      # After a punch, bbox area must shrink by at least this much before rearming when hands are enabled. input.
      bbox_area_retract_epsilon: 0.0003
      # When hand tracking is disabled, wait this long before rearming from the pose-only fallback. input.
      pose_only_rearm_ms: 10
    state_machine:
      # After tracking comes back, wait this long before punches can arm again. input.
      lost_tracking_reacquire_stable_ms: 40
  prototype:
    # Side-aware prototype matching is a real straight-family runtime option. input.
    prototype_library:
      # Named curated prototype library/profile to load for boxing prototype matching. input.
      library_id: boxing_side_aware_v1
    evaluation:
      # Measure each prototype-matching decision across this much recent time. input.
      window_ms: 250
      # Re-evaluate the rolling matcher this often. input.
      window_step_ms: 33
    thresholds:
      # Require the best positive-class match score to reach at least this 0..1 value or emit no_punch. input.
      match_score_min: 0.70
    timing:
      # After a punch event fires, suppress duplicate re-fires for this long. input.
      emit_cooldown_ms: 250
      # Keep the current confident event active for this long before allowing a new event. input.
      emit_hold_ms: 100
    debug:
      # Show per-class match scores in proving/debug views. input presentation.
      show_scores: true
      # Show duplicate-suppression / hold state in proving/debug views. input presentation.
      show_event_gate_state: true
  classifier:
    # The learned straight-family runtime reads this block when `backend: classifier`. input.
    model:
      # Exported learned straight-classifier artifact to load for the straight family. input.
      artifact_path: res://addons/aerobeat-input-camera-tracking/docs/baselines/boxing-punch-classifier-frozen-benchmark-mlp-vs-cnn-2026-06-16/mlp/mlp-result.json
    thresholds:
      # Require the best learned positive-class score to reach at least this 0..1 value or emit no_punch. input.
      match_score_min: 0.70
    timing:
      # After a punch event fires, suppress duplicate re-fires for this long. input.
      emit_cooldown_ms: 250
      # Keep the current confident event active for this long before allowing a new event. input.
      emit_hold_ms: 100
    debug:
      # Show per-class learned scores in proving/debug views. input presentation.
      show_scores: true
      # Show duplicate-suppression / hold state in proving/debug views. input presentation.
      show_event_gate_state: true

hook:
  # [disabled, threshold, prototype, classifier] Pick which backend owns hook routing. `threshold` is the current shipped default; `prototype` and `classifier` are real punch-family runtime surfaces when selected. input.
  backend: disabled
  threshold:
    # Hooks use the current pose-primary hook runtime when `backend: threshold`. input.
    evaluation:
      # Measure the shared hook motion window across this much recent time. input.
      window_ms: 250
    thresholds:
      # Shared elbow+wrist averaged velocity across the motion window must reach at least this value to count as a hook. input.
      min_velocity: 0.4
      # Wrist must stay within this many degrees of an elbow-anchored horizontal ray in camera-space XY for the hook threshold path to arm. input.
      #- `0` = wrist must be almost perfectly horizontal from the elbow
      #- `45` = wrist can drift up/down within a moderate horizontal arc
      #- `90` = angle no longer constrains hook-vs-vertical alignment
      max_wrist_angle_from_elbow_horizontal_deg: 25.0
    timing:
      # Keep the hook in its triggered state for this long after it fires. input.
      triggered_grace_ms: 500
    rearm:
      # After a hook, wait this long before the pose-primary detector can rearm. input.
      pose_only_rearm_ms: 50
    state_machine:
      # After pose tracking comes back, wait this long before hooks can arm again. input.
      lost_tracking_reacquire_stable_ms: 40
  prototype:
    # Hooks share the same prototype-matcher runtime surface as the other punch families when selected. input.
    prototype_library:
      # Named curated prototype library/profile to load for boxing prototype matching. input.
      library_id: boxing_side_aware_v1
    evaluation:
      # Measure each prototype-matching decision across this much recent time. input.
      window_ms: 250
      # Re-evaluate the rolling matcher this often. input.
      window_step_ms: 33
    thresholds:
      # Require the best positive-class match score to reach at least this 0..1 value or emit no_punch. input.
      match_score_min: 0.70
    timing:
      # After a punch event fires, suppress duplicate re-fires for this long. input.
      emit_cooldown_ms: 250
      # Keep the current confident event active for this long before allowing a new event. input.
      emit_hold_ms: 100
    debug:
      # Show per-class match scores in proving/debug views. input presentation.
      show_scores: true
      # Show duplicate-suppression / hold state in proving/debug views. input presentation.
      show_event_gate_state: true
  classifier:
    # Hooks can still point at the shared learned punch-classifier runtime, but runtime/debug stays explicit about which families actually select it. input.
    model:
      # Exported learned-classifier artifact to load when hook routing selects the classifier runtime. input.
      artifact_path: res://addons/aerobeat-input-camera-tracking/docs/baselines/boxing-punch-classifier-frozen-benchmark-mlp-vs-cnn-2026-06-16/mlp/mlp-result.json
    thresholds:
      # Require the best learned positive-class score to reach at least this 0..1 value or emit no_punch. input.
      match_score_min: 0.70
    timing:
      # After a punch event fires, suppress duplicate re-fires for this long. input.
      emit_cooldown_ms: 250
      # Keep the current confident event active for this long before allowing a new event. input.
      emit_hold_ms: 100
    debug:
      # Show per-class learned scores in proving/debug views. input presentation.
      show_scores: true
      # Show duplicate-suppression / hold state in proving/debug views. input presentation.
      show_event_gate_state: true

uppercut:
  # [disabled, threshold, prototype, classifier] Pick which backend owns uppercut routing. `threshold` is the current shipped default; `prototype` and `classifier` are real punch-family runtime surfaces when selected. input.
  backend: disabled
  threshold:
    # Uppercuts use the current pose-primary uppercut runtime when `backend: threshold`. input.
    evaluation:
      # Measure the shared uppercut motion window across this much recent time. input.
      window_ms: 250
    thresholds:
      # Shared elbow+wrist averaged velocity across the motion window must reach at least this value to count as an uppercut. input.
      min_velocity: 0.5
      # Wrist must stay within this many degrees of an elbow-anchored vertical ray in camera-space XY for the uppercut threshold path to arm. input.
      #- `0` = wrist must be almost perfectly vertical from the elbow
      #- `45` = wrist can drift sideways within a moderate vertical arc
      #- `90` = angle no longer constrains uppercut-vs-horizontal alignment
      max_wrist_angle_from_elbow_vertical_deg: 25.0
    timing:
      # Keep the uppercut in its triggered state for this long after it fires. input.
      triggered_grace_ms: 500
    rearm:
      # After an uppercut, wait this long before the pose-primary detector can rearm. input.
      pose_only_rearm_ms: 50
    state_machine:
      # After pose tracking comes back, wait this long before uppercuts can arm again. input.
      lost_tracking_reacquire_stable_ms: 40
  prototype:
    # Uppercuts share the same prototype-matcher runtime surface as the other punch families when selected. input.
    prototype_library:
      # Named curated prototype library/profile to load for boxing prototype matching. input.
      library_id: boxing_side_aware_v1
    evaluation:
      # Measure each prototype-matching decision across this much recent time. input.
      window_ms: 250
      # Re-evaluate the rolling matcher this often. input.
      window_step_ms: 33
    thresholds:
      # Require the best positive-class match score to reach at least this 0..1 value or emit no_punch. input.
      match_score_min: 0.70
    timing:
      # After a punch event fires, suppress duplicate re-fires for this long. input.
      emit_cooldown_ms: 250
      # Keep the current confident event active for this long before allowing a new event. input.
      emit_hold_ms: 100
    debug:
      # Show per-class match scores in proving/debug views. input presentation.
      show_scores: true
      # Show duplicate-suppression / hold state in proving/debug views. input presentation.
      show_event_gate_state: true
  classifier:
    # Uppercuts can still point at the shared learned punch-classifier runtime, but runtime/debug stays explicit about which families actually select it. input.
    model:
      # Exported learned-classifier artifact to load when uppercut routing selects the classifier runtime. input.
      artifact_path: res://addons/aerobeat-input-camera-tracking/docs/baselines/boxing-punch-classifier-frozen-benchmark-mlp-vs-cnn-2026-06-16/mlp/mlp-result.json
    thresholds:
      # Require the best learned positive-class score to reach at least this 0..1 value or emit no_punch. input.
      match_score_min: 0.70
    timing:
      # After a punch event fires, suppress duplicate re-fires for this long. input.
      emit_cooldown_ms: 250
      # Keep the current confident event active for this long before allowing a new event. input.
      emit_hold_ms: 100
    debug:
      # Show per-class learned scores in proving/debug views. input presentation.
      show_scores: true
      # Show duplicate-suppression / hold state in proving/debug views. input presentation.
      show_event_gate_state: true

knee_strike:
  # [disabled, threshold, prototype, classifier] Pick which backend contract owns knee-strike routing. Only `threshold` has a real runtime implementation today; `prototype` and `classifier` stay as honest placeholders for the approved family-first config shape. input.
  backend: disabled
  threshold: {}
  prototype: {}
  classifier: {}

leg_lift:
  # [disabled, threshold, prototype, classifier] Pick which backend contract owns leg-lift routing. Only `threshold` has a real runtime implementation today; `prototype` and `classifier` stay as honest placeholders for the approved family-first config shape. input.
  backend: disabled
  threshold: {}
  prototype: {}
  classifier: {}

side_step:
  # [disabled, threshold, prototype, classifier] Pick which backend contract owns side-step routing. Only `threshold` has a real runtime implementation today; `prototype` and `classifier` stay as honest placeholders for the approved family-first config shape. input.
  backend: disabled
  threshold: {}
  prototype: {}
  classifier: {}
