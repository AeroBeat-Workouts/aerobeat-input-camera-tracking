schema: aerobeat/testbed_debug_config
version: 1
profile: boxing
visuals:
  # Show the pose landmark overlay in the proving scene. input debug only.
  show_landmarks: true
  # Show debug hit targets around landmarks. input debug only.
  show_landmark_hit_targets: false
  # Show labels for those debug hit targets. input debug only.
  show_landmark_hit_target_labels: false
refresh:
  # Refresh the big debug panels this often so they stay readable. input debug only.
  debug_panel_refresh_interval_ms: 160
  # Refresh the live inspector values this often. input debug only.
  inspector_live_refresh_interval_ms: 120
