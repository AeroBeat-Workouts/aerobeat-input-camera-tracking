schema: aerobeat/camera_tracking_config
version: 1
profile: flow
preview:
  surface_mode: attach
  flip_horizontal: true
  live:
    # Emit a live preview feed only when this profile wants one. input -> tool -> vendor.
    enabled: true
    # Throttle live preview updates without changing live tracking cadence. tool -> vendor.
    max_fps: 10
    # Resize emitted live preview frames without pretending to change live decode/inference. tool -> vendor.
    width: 960
    height: 540
    quality: 75
  replay:
    # Emit a replay preview feed only when this profile wants one. input -> tool -> vendor.
    enabled: true
    # Throttle replay preview updates without inventing replay decode controls the vendor does not support. tool -> vendor.
    max_fps: 10
    width: 960
    height: 540
    quality: 75
  overlays:
    # Show the pose/skeleton overlay in the preview presenter independently from full video feed visibility. input presentation.
    pose_skeleton_visible: true
source:
  live_camera:
    # Request this live capture size from the real camera path. tool -> vendor.
    requested_width: 960
    requested_height: 540
    # Request this live capture cadence from the real camera path. tool -> vendor.
    requested_fps: 15
tracking:
  # Cap tracker sampling work. This is a requested upper bound, not a promise of achieved FPS on all hardware. input -> tool -> vendor.
  max_fps: 30
  # Cap how often runtime state/debug updates publish. Replay/live preview cadence is now decoupled and continues to follow its own preview.*.max_fps caps. This is a requested upper bound, not a guaranteed delivered FPS. input -> tool -> vendor.
  state_update_max_fps: 30
  pose:
    # Turn pose tracking on or off. Passed through tool -> vendor.
    enabled: true
    # Run pose inference every N source frames. vendor.
    inference_interval_frames: 1
    # [lite_filtered, lite_raw] Pick the pose smoothing mode after pose samples come back. tool -> vendor.
    smoothing_style: lite_filtered