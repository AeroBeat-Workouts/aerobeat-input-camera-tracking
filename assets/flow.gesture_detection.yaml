schema: aerobeat/gesture_detection_config
version: 1
profile: flow
calibration:
  # Auto-capture the shared athlete baseline from a held T-pose. input/runtime.
  mode: t_pose_auto
  t_pose:
    # Fire calibration immediately when this continuous hold duration is satisfied. input/runtime.
    hold_ms: 4000
    # Allow re-firing from the same held T-pose after this cooldown elapses. input/runtime.
    cooldown_ms: 4000
    # Scale the calibrated 4x3 grid size after wrist-span capture. 1.0 = current size; higher grows the grid; lower shrinks it. input/runtime.
    grid_size_multiplier: 1.1
    # Shift the calibrated 4x3 grid vertically in camera space. 0.0 = current height; positive raises the grid; negative lowers it. input/runtime.
    camera_space_grid_height_offset: -0.05
    thresholds:
      # Maximum wrist-vs-shoulder vertical drift ratio for a valid T-pose. Lower = stricter/leveler wrists; higher = more tolerance. input/runtime.
      max_wrist_shoulder_y_ratio: 0.35
      # Maximum elbow-vs-shoulder vertical drift ratio for a valid T-pose. Lower = stricter/leveler elbows; higher = more tolerance. input/runtime.
      max_elbow_shoulder_y_ratio: 0.35
      # Minimum elbow angle for a valid T-pose. Lower = allows more bend; higher = requires straighter elbows. input/runtime.
      min_elbow_angle_deg: 130.0
flow:
  # Flow uses the shared calibrated 4x3 cell occupancy + direction contract. input.
  backend: threshold
  threshold: {}
straight_punch:
  # Flow keeps straight punches inactive by selecting the disabled backend. input.
  backend: disabled
  threshold: {}
