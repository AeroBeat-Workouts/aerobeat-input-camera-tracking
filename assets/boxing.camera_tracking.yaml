schema: aerobeat/camera_tracking_config
version: 1
profile: boxing
preview:
  surface_mode: attach
  flip_horizontal: false
  live:
    # Emit a live preview feed only when this profile wants one. input -> tool -> vendor.
    enabled: true
    # Throttle live preview updates without changing live tracking cadence. tool -> vendor.
    max_fps: 60
    # Resize emitted live preview frames without pretending to change live decode/inference. tool -> vendor.
    width: 960
    height: 540
    quality: 75
  replay:
    # Emit a replay preview feed only when this profile wants one. input -> tool -> vendor.
    enabled: true
    # Throttle replay preview updates without inventing replay decode controls the vendor does not support. tool -> vendor.
    max_fps: 60
    width: 960
    height: 540
    quality: 75
  overlays:
    # Show the pose/skeleton overlay in the preview presenter independently from full video feed visibility. input presentation.
    pose_skeleton_visible: true
    # Show the boxing hand bbox overlay independently from full video feed visibility. input presentation.
    hand_bbox_visible: true
source:
  live_camera:
    # Request this live capture size from the real camera path. tool -> vendor.
    requested_width: 960
    requested_height: 540
    # Request this live capture cadence from the real camera path. tool -> vendor.
    requested_fps: 60
tracking:
  # Cap tracker sampling work. This is a requested upper bound, not a promise of achieved FPS on all hardware. input -> tool -> vendor.
  max_fps: 30
  # Cap how often runtime state/preview updates publish. This is a requested upper bound, not a guaranteed delivered FPS. input -> tool -> vendor.
  state_update_max_fps: 30
  pose:
    # Turn pose tracking on or off. Passed through tool -> vendor.
    enabled: true
    # Run pose inference every N source frames. vendor.
    inference_interval_frames: 1
    # [lite_filtered, lite_raw] Pick the pose smoothing mode after pose samples come back. tool -> vendor.
    smoothing_style: lite_filtered
  hands:
    # Turn hand tracking on or off for this profile. tool -> vendor.
    enabled: true
    # [lite, full] Pick the hand landmark detail level. vendor.
    landmark_mode: lite
    # Run hand inference every N source frames. vendor.
    inference_interval_frames: 1
    bbox:
      # Include hand bbox data in the tracked hand payload. tool.
      enabled: true
    association:
      # Keep an already-matched hand on the same body side when it still makes sense. tool.
      prefer_existing_pose_side_binding: true
      # Fall back to the nearest wrist when side matching is not stable yet. tool.
      nearest_wrist_fallback: true
    validity:
      # Drop a hand after this many ms without a real sample. tool -> vendor.
      max_stale_ms: 1000
      # Require this much stable time before a lost hand is trusted again. tool -> vendor.
      reacquire_stable_ms: 40
    grace:
      # Let the tracker predict a missing hand for a short gap instead of losing it immediately. tool.
      enabled: true
      # Keep this much of the last hand movement each grace step. tool.
      position_decay: 1.0
      # Keep this much of the last hand size change each grace step. tool.
      size_decay: 1.0
